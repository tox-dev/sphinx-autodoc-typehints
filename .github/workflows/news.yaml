name: 📝 Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  changelog:
    name: 📝 News fragment
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@6.8.0
        with:
          groups: release-prepare
          venv: ${{ runner.temp }}/release-tools
      - name: 🧹 Check updated source
        uses: tox-dev/github-workflows/cooled-prek@6.8.0
        with:
          args: run --all-files
      - name: 🔍 Validate news fragments
        uses: tox-dev/github-workflows/validate-news@6.8.0
