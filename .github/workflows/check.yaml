name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "11 9 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-26.04
    env:
      # the runner's own interpreters lack the C headers the extension-module tests compile against
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        env:
          - "3.15t"
          - "3.15"
          - "3.14t"
          - "3.14"
          - "3.13"
          - "3.12"
          - type
          - dev
          - pkg_meta
          - docs
    steps:
      - name: 📦 Install Graphviz
        id: graphviz
        background: true
        run: sudo apt-get install graphviz -y
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🐍 Install Python
        if: startsWith(matrix.env, '3.') && matrix.env != '3.15'
        run: uv python install --python-preference only-managed ${{ matrix.env }}
      - name: ⏳ Wait for graphviz
        wait: graphviz
      - name: 📦 Set up test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.env }}
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install -e ${{ matrix.env }}
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          # a pull request is held to 100% coverage of the lines it changes; other runs have no base to diff against
          DIFF_AGAINST: ${{ github.event.pull_request.base.sha || 'HEAD' }}
  release:
    name: 🏷️ Release dry run
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
  required-checks-pass:
    name: 🚦 Required checks pass
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, release, hooks]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@6.8.0
        with:
          needs: ${{ toJSON(needs) }}
