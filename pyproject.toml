[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
]

[project]
name = "sphinx-autodoc-typehints"
description = "Type hints (PEP 484) support for the Sphinx autodoc extension"
keywords = [
  "environments",
  "isolated",
  "testing",
  "virtual",
]
license = "MIT"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
authors = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Sphinx :: Extension",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Documentation :: Sphinx",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "sphinx>=9.1",
  "typing-extensions>=4.16; python_version<'3.15'",
]
urls.Changelog = "https://github.com/tox-dev/sphinx-autodoc-typehints/releases"
urls.Documentation = "https://sphinx-autodoc-typehints.readthedocs.io"
urls.Homepage = "https://github.com/tox-dev/sphinx-autodoc-typehints"
urls.Source = "https://github.com/tox-dev/sphinx-autodoc-typehints"
urls.Tracker = "https://github.com/tox-dev/sphinx-autodoc-typehints/issues"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "attrs>=26.1",
  "covdefaults>=2.3",
  "coverage>=7.16.2",
  "defusedxml>=0.7.1",
  "diff-cover>=10.6",
  "numpydoc>=1.11",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-randomly>=5",
  "sphinx-design>=0.7",
  "sphobjinv>=2.4",
  "typing-extensions>=4.16",
]
type = [
  "ty<0.0.89,>=0.0.88",
  { include-group = "test" },
]
docs = [
  "attrs>=26.1",
  "furo>=2025.12.19",
  "numpydoc>=1.11",
  "sphinx>=9.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-llm>=1,!=1.1",
  "sphinx-sitemap>=2.9",
  "sphinxcontrib-mermaid>=2.1.1",
  "sphinxcontrib-towncrier>=0.5.0a0",
  "sphinxext-opengraph>=0.13",
  "towncrier>=26.9",
  "typing-extensions>=4.16",
]
lint = [
  "pre-commit-uv>=4.4",
]
pkg-meta = [
  "check-wheel-contents>=0.6.3",
  "twine>=7",
  "uv>=0.13.1",
]
release = [
  "towncrier>=26.9",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
metadata.hooks.fancy-pypi-readme.substitutions = [
  # PyPI renders the README outside the repository, where a relative link resolves to nothing
  { pattern = '\]\((?!https?://|#)(?P<path>[^)]+)\)', replacement = '](https://github.com/tox-dev/sphinx-autodoc-typehints/blob/main/\g<path>)' },
]
build.hooks.vcs.version-file = "src/sphinx_autodoc_typehints/version.py"

[tool.ruff]
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # No copyright statements
  "DOC",                                       # no sphinx support
  "hardcoded-bind-all-interfaces",             # Possible binding to all interface
  "incorrect-blank-line-before-class",         # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
  "non-empty-init-module",                     # `__init__` module should only contain docstrings and re-exports
  "relative-imports",                          # intra-package imports climb at most two levels, deeper ones stay absolute
  "single-line-implicit-string-concatenation", # Conflict with formatter
]
lint.per-file-ignores."src/sphinx_autodoc_typehints/_patches/*.py" = [
  "private-member-access", # the module exists to monkeypatch docutils and napoleon internals
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # asserts allowed in tests
  "D",                                    # don't care about documentation in tests
  "FBT",                                  # don't care about booleans as positional arguments in tests
  "implicit-namespace-package",           # no implicit namespace
  "import-private-name",                  # private imports
  "legacy-type-comment",                  # we test for legacy `# type:` comments
  "magic-value-comparison",               # Magic value used in comparison, consider replacing with a constant variable
  "non-pep585-annotation",                # we test for old List/Tuple syntax
  "non-pep604-annotation-optional",       # we test for old Optional syntax
  "non-pep604-annotation-union",          # we test for old Union syntax
  "pytest-fixture-autouse",               # shared setup fixtures are meant to apply to every test
  "pytest-incorrect-pytest-import",       # names come from pytest like from any other module
  "subprocess-without-shell-equals-true", # `subprocess` call: check for execution of untrusted input
  "too-many-arguments",                   # any number of arguments in tests
  "too-many-positional-arguments",        # any number of arguments in tests
]
lint.per-file-ignores."tests/roots/**/*.py" = [
  "any-type", # the modules under test annotate with Any to check how it renders
]
lint.per-file-ignores."tests/roots/test-attrs/attrs_lazy_mod.py" = [
  "missing-required-import",               # intentionally omits `from __future__ import annotations` to keep annotations lazy
  "runtime-import-in-type-checking-block", # the guarded import is the case under test
]
lint.per-file-ignores."tests/roots/test-integration/mod_eager.py" = [
  "missing-required-import",  # this file intentionally omits `from __future__ import annotations` to test non-deferred annotations
  "no-self-use",              # a subclass binds the type parameter of an inherited instance method
  "non-pep695-generic-class", # the type parameter must be a module global, as only the legacy spelling makes it
  "return-in-generator",      # the generator's return value is the type under test
]
lint.per-file-ignores."tests/roots/test-integration/mod_forward_ref.py" = [
  "missing-required-import", # intentionally omits `from __future__ import annotations` to test forward references
  "no-self-use",             # method must be instance method to test class forward refs
]
lint.per-file-ignores."tests/roots/test-public-api/public_module.py" = [
  "ANN",                                       # a type comment stands in for the annotations
  "lambda-assignment",                         # the lambda's source line holds a second statement
  "multiple-statements-on-one-line-semicolon", # the source of the lambda then parses to two nodes
  "no-self-use",                               # a method of a class local to a function
  "undefined-name",                            # the forward reference the warning reports
  "unused-import",                             # the guarded import that fails to run
]
lint.per-file-ignores."tests/roots/test-pyi-stubs/stub_mod.py" = [
  "ANN",                     # intentionally has no type annotations to simulate a C extension
  "missing-required-import", # intentionally omits `from __future__ import annotations`
  "no-self-use",             # method must be instance method to test stub resolution
  "unused-async",            # async function must be async to test async stub resolution
]
lint.per-file-ignores."tests/roots/test-pyi-stubs/stub_mod.pyi" = [
  "complex-if-statement-in-stub", # third-party stubs gate on more than sys.version_info, which the resolver must survive
  "missing-required-import",      # stub files don't use `from __future__ import annotations`
]
lint.per-file-ignores."tests/roots/test-unexecutable-guard/demo_unexecutable_guard.py" = [
  "non-pep695-generic-function", # the legacy TypeVar spelling is what the guard cannot execute
]
lint.isort = { known-first-party = [
  "sphinx_autodoc_typehints",
  "tests",
], required-imports = [
  "from __future__ import annotations",
] }
# autodoc calls an autodoc-process-signature listener with seven positional arguments
lint.pylint.max-args = 7
lint.pylint.max-positional-args = 7
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
ignore-words = "ignore-words.txt"
write-changes = true
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
src.exclude = [ "tests/roots/" ]
environment.python-version = "3.15"
overrides = [ { include = [ "tests/" ], rules.empty-body = "ignore" } ]

[tool.pytest]
ini_options.testpaths = [
  "tests",
]
ini_options.filterwarnings = [
  "error",
  "ignore:.*rm_rf.*:pytest.PytestWarning",
  # Sphinx's own napoleon tests `if options:`, which Sphinx 9 deprecates for autodoc options
  "ignore::sphinx.deprecation.RemovedInSphinx11Warning:sphinx\\.ext\\.napoleon\\..*",
  "ignore:urllib3.*doesn't match a supported version",
]

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.source = [
  "src",
  ".tox/*/lib/python*/site-packages",
  ".tox/pypy*/site-packages",
  ".tox\\*\\Lib\\site-packages",
  ".tox/*/.venv/lib/python*/site-packages",
  ".tox/pypy*/.venv/site-packages",
  ".tox\\*\\.venv\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.fail_under = 100
report.omit = [
  "tests/roots/*",
]
html.show_contexts = true
html.skip_covered = false

[tool.towncrier]
name = "sphinx-autodoc-typehints"
directory = "docs/changelog"
filename = "docs/changelog.rst"
template = "docs/changelog/template.jinja2"
title_format = false
issue_format = ":pr:`{issue}`"
type = [
  { directory = "breaking", name = "Backward incompatible changes", showcontent = true },
  { directory = "feature", name = "Features", showcontent = true },
  { directory = "bugfix", name = "Bug fixes", showcontent = true },
  { directory = "doc", name = "Improved documentation", showcontent = true },
  { directory = "packaging", name = "Packaging updates", showcontent = true },
]

[tool.importlinter]
root_package = "sphinx_autodoc_typehints"

[[tool.importlinter.contracts]]
name = "a layer imports only the layers below it"
type = "layers"
containers = [ "sphinx_autodoc_typehints" ]
layers = [
  "_extension",
  "_config : _patches",
  "_docstring | _signature",
  "_documented",
  "_render | _resolve",
  "_objects : _refs : _state : _warnings : _private_imports : _types",
]
