[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
]

[project]
name = "sphinx-autodoc-typehints"
description = "Type hints (PEP 484) support for the Sphinx autodoc extension"
readme.content-type = "text/markdown"
readme.file = "README.md"
keywords = [
  "environments",
  "isolated",
  "testing",
  "virtual",
]
license = "MIT"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
authors = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Sphinx :: Extension",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Documentation :: Sphinx",
]
dynamic = [
  "version",
]
dependencies = [
  "sphinx>=9.1",
]
urls.Changelog = "https://github.com/tox-dev/sphinx-autodoc-typehints/releases"
urls.Homepage = "https://github.com/tox-dev/sphinx-autodoc-typehints"
urls.Source = "https://github.com/tox-dev/sphinx-autodoc-typehints"
urls.Tracker = "https://github.com/tox-dev/sphinx-autodoc-typehints/issues"

[dependency-groups]
dev = [
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "attrs>=26.1",
  "covdefaults>=2.3",
  "coverage>=7.16.2",
  "defusedxml>=0.7.1",
  "diff-cover>=10.6",
  "numpydoc>=1.11",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "sphobjinv>=2.4",
  "typing-extensions>=4.16",
]
type = [
  "ty<0.0.25,>=0.0.24",
  { include-group = "docs" },
  { include-group = "test" },
]
docs = [
  "furo>=2025.12.19",
]
lint = [
  "pre-commit-uv>=4.3",
]
pkg-meta = [
  "check-wheel-contents>=0.6.3",
  "twine>=7",
  "uv>=0.12.22",
]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/sphinx_autodoc_typehints/version.py"

[tool.ruff]
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "any-type",                                  # allow Any as type annotation
  "CPY",                                       # No copyright statements
  "DOC",                                       # no sphinx support
  "hardcoded-bind-all-interfaces",             # Possible binding to all interface
  "incorrect-blank-line-before-class",         # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
  "non-empty-init-module",                     # `__init__` module should only contain docstrings and re-exports
  "single-line-implicit-string-concatenation", # Conflict with formatter
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # asserts allowed in tests
  "class-as-data-structure",              # test fixture classes intentionally use plain __init__ without dataclass
  "D",                                    # don't care about documentation in tests
  "FBT",                                  # don't care about booleans as positional arguments in tests
  "implicit-namespace-package",           # no implicit namespace
  "import-private-name",                  # private imports
  "legacy-type-comment",                  # we test for legacy `# type:` comments
  "magic-value-comparison",               # Magic value used in comparison, consider replacing with a constant variable
  "non-pep585-annotation",                # we test for old List/Tuple syntax
  "non-pep604-annotation-optional",       # we test for old Optional syntax
  "non-pep604-annotation-union",          # we test for old Union syntax
  "pytest-fixture-autouse",               # shared setup fixtures are meant to apply to every test
  "subprocess-without-shell-equals-true", # `subprocess` call: check for execution of untrusted input
  "too-many-arguments",                   # any number of arguments in tests
  "too-many-positional-arguments",        # any number of arguments in tests
]
lint.per-file-ignores."tests/roots/test-integration/mod_eager.py" = [
  "missing-required-import", # this file intentionally omits `from __future__ import annotations` to test non-deferred annotations
]
lint.per-file-ignores."tests/roots/test-integration/mod_forward_ref.py" = [
  "missing-required-import", # intentionally omits `from __future__ import annotations` to test forward references
  "no-self-use",             # method must be instance method to test class forward refs
]
lint.per-file-ignores."tests/roots/test-pyi-stubs/stub_mod.py" = [
  "ANN",                     # intentionally has no type annotations to simulate a C extension
  "missing-required-import", # intentionally omits `from __future__ import annotations`
  "no-self-use",             # method must be instance method to test stub resolution
  "unused-async",            # async function must be async to test async stub resolution
]
lint.per-file-ignores."tests/roots/test-pyi-stubs/stub_mod.pyi" = [
  "missing-required-import", # stub files don't use `from __future__ import annotations`
]
lint.per-file-ignores."tests/roots/test-unexecutable-guard/demo_unexecutable_guard.py" = [
  "non-pep695-generic-function", # the legacy TypeVar spelling is what the guard cannot execute
]
lint.per-file-ignores."tests/test_resolver/test_type_comments.py" = [
  "missing-type-function-argument", # type comment fixtures intentionally omit annotations
  "unused-function-argument",       # type comment fixtures have intentionally unused args
]
lint.isort = { known-first-party = [
  "sphinx_autodoc_typehints",
  "tests",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
ignore-words = "ignore-words.txt"
write-changes = true
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
src.exclude = [ "tests/roots/" ]
environment.python-version = "3.15"
overrides = [ { include = [ "tests/" ], rules.empty-body = "ignore" } ]

[tool.pytest]
ini_options.testpaths = [
  "tests",
]
ini_options.filterwarnings = [
  "error",
  "ignore:.*rm_rf.*:pytest.PytestWarning",
  "ignore::sphinx.deprecation.RemovedInSphinx11Warning", # numpydoc upstream: https://github.com/numpy/numpydoc/issues/679
  "ignore:urllib3.*doesn't match a supported version",
]

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.source = [
  "src",
  ".tox/*/lib/python*/site-packages",
  ".tox/pypy*/site-packages",
  ".tox\\*\\Lib\\site-packages",
  ".tox/*/.venv/lib/python*/site-packages",
  ".tox/pypy*/.venv/site-packages",
  ".tox\\*\\.venv\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.fail_under = 88
report.omit = [
  "tests/roots/*",
]
html.show_contexts = true
html.skip_covered = false
